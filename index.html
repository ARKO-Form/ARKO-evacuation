se}}function ex(){return db.exercises.find(e=>e.id===db.active)}function cli(cid){return db.clients.find(c=>c.id===cid)}function time(s){let a=Math.max(0,Math.floor(s||0));return String(Math.floor(a/60)).padStart(2,'0')+':'+String(a%60).padStart(2,'0')}function elapsed(e){if(!e.start)return 0;return Math.max(0,Math.round(((e.stop||Date.now())-e.start)/1000))}function localdate(s){return s?new Date(s).toLocaleString('fr-FR'):'—'}function dateval(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function newE(){return{id:id(),client:'',building:'',date:dateval(),trainer:'Quentin',scenario:'',expected:'',announced:'Annoncé',goals:'',notes:'',start:null,stop:null,events:[],observations:{},anomalies:[],annotations:[],conclusion:'',siteInfo:{},finalChecks:{},positives:'',improvements:'',status:'Brouillon',created:now()}}function ensureAnnotations(){let e=ex();if(e&&!Array.isArray(e.annotations))e.annotations=[];return e}function nav(){const tabs=[['home','⌂','Accueil'],['exercises','▤','Exercices'],['clients','♙','Clients'],['backup','⚙','Données']];$('#nav').innerHTML=tabs.map(([v,ic,label])=>`<button class="${view===v?'active':''}" onclick="go('${v}')"><span>${ic}</span>${label}</button>`).join('')}function render(){nav();const a=$('#app');a.innerHTML=({home:home,clients:clientsPage,exercises:exercisesPage,prep:prep,live:live,observations:observations,anomalies:anomalies,annotations:annotations,report:report,details:details,finalcheck:finalcheck,backup:backup}[view]||home)();if(view==='live')tick();else if(liveTimer){clearInterval(liveTimer);liveTimer=null}}function go(v){view=v;render();window.scrollTo(0,0)}function startNew(){const e=newE();db.exercises.unshift(e);db.active=e.id;store();go('prep')}function quickStart(){const e=newE();e.scenario='Mode chronomètre rapide';db.exercises.unshift(e);db.active=e.id;store();go('live')}function openE(i){db.active=i;store();go('prep')}function home(){ ">${db.exercises.map(e=>`<div class="item row"><div><b>${esc(cli(e.client)?.name||'Client non renseigné')}</b><div class="small muted">${esc(e.date)} · ${esc(e.building)}</div><span class="badge ${e.status==='Terminé'?'':'orange'}">${esc(e.status)}</span></div><div class="stack"><button class="btn mini ghost" onclick="openE('${e.id}')">Ouvrir</button>${isLocked(e)?'<span class="badge gray">🔒 Archivé</span>':`<button class="btn mini danger-outline" onclick="deleteExercise('${e.id}')">Supprimer définitivement</button>`}</div></div>`).join('')||'<p>Aucun exercice.</p>'}</div>`}function prep(){let e=ex();if(!e)return home();return `<div class="eyebrow">Étape 1 · Préparation</div><h1>Nouvel exercice</h1><p>Renseignez les informations principales et enregistrez votre brouillon.</p><div class="card"><label>Client *</label><select id="client">${'<option value="">Choisir un client</option>'}${db.clients.filter(c=>!c.archived||c.id===e.client).map(c=>`<option value="${c.id}" ${e.client===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>${db.clients.length===0?'<p class="notice">Créez d’abord un client dans l’onglet Clients.</p>':''}<label>Bâtiment / zone *</label><input id="building" value="${esc(e.building)}" placeholder="Bâtiment principal"><label>Date *</label><input type="date" id="date" value="${esc(e.date)}"><label>Formateur</label><input id="trainer" value="${esc(e.trainer)}"><label>Scénario</label><textarea id="scenario" placeholder="Ex. : déclenchement de l’alarme incendie">${esc(e.scenario)}</textarea><div class="two"><div><label>Effectif estimé</label><input type="number" min="0" id="expected" value="${esc(e.expected)}"></div><div><label>Type</label><select id="announced"><option ${e.announced==='Annoncé'?'selected':''}>Annoncé</option><option ${e.announced==='Inopiné'?'selected':''}>Inopiné</option></select></div></div><label>Objectifs de l'exercice</label><textarea id="goals" placeholder="Ex. : tester la prise en charge des occupants">${esc(e.goals)}</textarea><button class="btn secondary full spaced" onclick="savePrep()">Enregistrer le brouillon</button></div><div class="stack"><button class="btn full" onclick="savePrep('live')">${e.start?'Reprendre le chronométrage':'Passer au chronométrage'} →</button><button class="btn ghost full" onclick="savePrep('details')">Informations détaillées du site →</button><button class="btn green full" onclick="savePrep('annotations')">✎ Annotations (avant / pendant / après)</button><button class="btn ghost full" onclick="savePrep('observations')">Compléter la grille d’évaluation</button><button class="btn ghost full" onclick="savePrep('finalcheck')">Vérifications de fin d’exercice</button><button class="btn ghost full" onclick="savePrep('report')">Voir le rapport</button></div>`}function savePrep(next){let e=ex();for(let f of ['client','building','date','trainer','scenario','expected','announced','goals'])e[f]=$('#'+f).value;e.status=e.status==='Terminé'?'Terminé':e.stop?'Chronométrage terminé':e.start?'En cours':'Brouillon';store();if(next)go(next);else alert('Brouillon enregistré sur cet appareil.')}function live(){let e=ex();if(!e)return home();let buttons=['Déclenchement alarme','Début évacuation','Dernier occupant sorti','Rassemblement terminé'];return `<div class="row"><div><div class="eyebrow">Étape 2 · Terrain</div><h1>Exercice en cours</h1></div><span class="badge ${e.start&&!e.stop?'':'orange'}">${e.start&&!e.stop?'En cours':'Prêt'}</span></div><p>${esc(cli(e.client)?.name||'Client non renseigné')} · ${esc(e.building)}</p><div class="timerbox"><div class="eyebrow">Temps depuis le démarrage manuel</div><div class="timer" id="clock">${time(elapsed(e))}</div>${!e.start?'<button class="btn full" onclick="startClock()">▶ Démarrer le chronomètre</button>':e.stop?'<div class="badge">Chronométrage terminé</div>':'<button class="btn ghost full" onclick="stopClock()">■ Terminer le chronométrage</button>'}</div><div class="card"><h2>Événements rapides</h2><p class="small">Choisis uniquement les événements constatés. L’ordre est libre.</p><div class="quick">${buttons.map((t,i)=>`<button class="btn ${i%2?'secondary':'outline'}" ${!e.start||e.stop?'disabled':''} onclick="addEvent('${i}')">${esc(t)}</button>`).join('')}</div><button class="btn ghost full spaced" onclick="addEvent('autre')" ${!e.start||e.stop?'disabled':''}>＋ Autre événement / remarque</button></div><div class="card"><h2>Chronologie (${e.events.length})</h2>${e.events.slice().reverse().map(v=>`<div class="item"><div class="row"><b>${esc(v.name)}</b><span class="badge gray">T + ${time(v.t)}</span></div><div class="small muted">${esc(v.source)} · ${esc(v.place||'Zone non précisée')} · ${localdate(v.timestamp)}</div>${v.note?`<div class="small">${esc(v.note)}</div>`:''}</div>`).join('')||'<p>Aucun événement enregistré.</p>'}</div><button class="btn green full" onclick="go('annotations')">✎ Ajouter des annotations à tout moment</button><button class="btn ghost full spaced" onclick="go('observations')">Grille d’évaluation →</button><button class="btn ghost full spaced" onclick="go('finalcheck')">Check-list de fin d’exercice →</button><p class="small">La durée affichée est celle du chronomètre. Elle ne remplace pas un horaire d’alarme non relevé.</p>`}function tick(){if(liveTimer)clearInterval(liveTimer);liveTimer=setInterval(()=>{let e=ex();if(e&&$('#clock'))$('#clock').textContent=time(elapsed(e))},500)}function startClock(){let e=ex();if(!e.start){e.start=Date.now();e.status='En cours';store()}render()}function stopClock(){let e=ex();if(!e.stop&&confirm('Terminer le chronométrage ? Cette action sera enregistrée.')){e.stop=Date.now();store();render()}}function addEvent(x){let e=ex(), names=['Déclenchement alarme','Début évacuation','Dernier occupant sorti','Rassemblement terminé'];let name=x==='autre'?prompt('Nom de l’événement :'):names[Number(x)];if(!name)return;let src=prompt('Source : saisir 1 = observé directement, 2 = communiqué par un tiers','1');if(src===null)return;let source=src==='2'?'Communiqué par un tiers':'Observé directement';let place=prompt('Position / zone au moment de l’observation (facultatif) :','')||'';let note=prompt('Commentaire rapide (facultatif) :','')||'';let stamp=Date.now();e.events.push({id:id(),name,source,place,note,t:Math.round((stamp-e.start)/1000),timestamp:new Date(stamp).toISOString()});store();render()}function annotations(){let e=ensureAnnotations();if(!e)return home();let phase=e.stop?'Après l’exercice':e.start?'Pendant l’exercice':'Avant l’exercice';return `<div class="eyebrow">Notes terrain · Indépendantes du chronomètre</div><h1>Annotations</h1><p>Saisis tes remarques avant, pendant ou après l'exercice. Aucun chronomètre requis.</p><div class="card"><div class="phase">Phase suggérée : ${phase}</div><form onsubmit="addAnnotation(event)"><label>Phase</label><select name="phase"><option ${phase==='Avant l’exercice'?'selected':''}>Avant l’exercice</option><option ${phase==='Pendant l’exercice'?'selected':''}>Pendant l’exercice</option><option ${phase==='Après l’exercice'?'selected':''}>Après l’exercice</option></select><label>Zone / emplacement</label><input name="place" placeholder="Facultatif : escalier, sortie, rassemblement…"><label>Source</label><select name="source"><option>Observé directement</option><option>Communiqué par un tiers</option><option>Autre / à préciser</option></select><label>Annotation *</label><textarea required name="text" placeholder="Note libre, constat, point positif, observation à reprendre dans le rapport..."></textarea><button class="btn green full spaced" type="submit">＋ Enregistrer l’annotation</button></form></div><div class="card"><h2>Annotations enregistrées (${e.annotations.length})</h2>${e.annotations.slice().reverse().map(a=>`<div class="item annotation"><div class="row"><b>${esc(a.phase)}</b><button class="btn mini danger-outline" onclick="removeAnnotation('${a.id}')">Retirer</button></div><div class="small muted">${esc(localdate(a.created))} · ${esc(a.place||'Zone non précisée')} · ${esc(a.source)}</div><p>${esc(a.text)}</p></div>`).join('')||'<p>Aucune annotation pour le moment.</p>'}</div><div class="stack"><button class="btn secondary full" onclick="go('live')">↩ Chronomètre</button><button class="btn ghost full" onclick="go('observations')">Grille d'évaluation</button><button class="btn ghost full" onclick="go('report')">Rapport</button></div>`}function addAnnotation(ev){ev.preventDefault();let e=ensureAnnotations(),f=new FormData(ev.target);e.annotations.push({id:id(),phase:f.get('phase'),place:f.get('place').trim(),source:f.get('source'),text:f.get('text').trim(),created:now()});store();render()}function removeAnnotation(i){let e=ensureAnnotations();if(confirm('Retirer cette annotation ?')){e.annotations=e.annotations.filter(a=>a.id!==i);store();render()}}
function observations(){let e=ex();if(!e)return home();return `<div class="eyebrow">Étape 3 · Évaluation</div><h1>Grille d’observation</h1><p>Grille complémentaire du modèle fourni : réponds uniquement aux critères évaluables depuis ta position. Tu peux compléter après l’exercice.</p>${criteria.map((c,i)=>{let v=e.observations[i]||{};return `<div class="card"><b>${i+1}. ${esc(c)}</b><div class="statuses spaced">${['Oui','Non','Non applicable'].map(s=>`<button class="${v.status===s?'selected':''}" onclick="setRating(${i},'${s}')">${s}</button>`).join('')}</div><label>Zone observée</label><input value="${esc(v.place)}" id="place${i}" onchange="updateObs(${i})" placeholder="Facultatif"><label>Précisions</label><textarea id="note${i}" onchange="updateObs(${i})" placeholder="Constat factuel…">${esc(v.note)}</textarea></div>`}).join('')}<button class="btn green full" onclick="go('annotations')">Notes libres / annotations →</button><button class="btn ghost full spaced" onclick="go('finalcheck')">Vérifications de fin d’exercice →</button><button class="btn ghost full spaced" onclick="go('anomalies')">Anomalies et recommandations →</button>`}function setRating(i,s){let e=ex();e.observations[i]={...(e.observations[i]||{}),status:s};store();render()}function updateObs(i){let e=ex();e.observations[i]={...(e.observations[i]||{}),place:$('#place'+i).value,note:$('#note'+i).value};store()}function anomalies(){let e=ex();if(!e)return home();return `<div class="eyebrow">Étape 4 · Constats</div><h1>Anomalies et préconisations</h1><div class="card"><h2>Ajouter un constat</h2><form onsubmit="addAnomaly(event)"><label>Nature de l'anomalie *</label><input name="title" required placeholder="Ex. : guide-file non identifiable"><label>Localisation</label><input name="place" placeholder="Ex. : escalier bâtiment B"><label>Description factuelle *</label><textarea name="description" required></textarea><label>Préconisation</label><textarea name="action"></textarea><label>Photo (facultatif, taille limitée)</label><input name="photo" accept="image/*" type="file"><button class="btn full spaced" type="submit">Ajouter au rapport</button></form></div><div class="card"><h2>Constats enregistrés (${e.anomalies.length})</h2>${e.anomalies.map((a,i)=>`<div class="item"><div class="row"><b>${esc(a.title)}</b><button class="btn ghost" onclick="delAnomaly(${i})">Retirer</button></div><div class="small muted">${esc(a.place)}</div><p>${esc(a.description)}</p><p><b>Préconisation :</b> ${esc(a.action||'À définir')}</p>${a.photo?`<img class="photo" src="${a.photo}" alt="Photographie du constat">`:''}</div>`).join('')||'<p>Aucune anomalie saisie.</p>'}</div><button class="btn green full" onclick="go('annotations')">Compléter les annotations →</button><button class="btn ghost full spaced" onclick="go('report')">Préparer le rapport →</button>`}async function addAnomaly(ev){ev.preventDefault();let f=new FormData(ev.target),photo=f.get('photo'),url='';if(photo&&photo.size){if(photo.size>1500000){alert('Photo trop volumineuse (maximum 1,5 Mo dans cette V1 locale).');return}url=await new Promise((res,rej)=>{let fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(photo)})}ex().anomalies.push({title:f.get('title'),place:f.get('place'),description:f.get('description'),action:f.get('action'),photo:url});if(store())render()}function delAnomaly(i){if(confirm('Retirer ce constat du brouillon ?')){ex().anomalies.splice(i,1);store();render()}}function report(){let e=ex();if(!e)return home();let c=cli(e.client);return `<div class="eyebrow">Étape 5 · Rapport</div><h1>Compte rendu</h1><p>Vérifie les informations avant de produire le document client.</p><div class="card"><h2>${esc(c?.name||'Client non renseigné')}</h2><p>${esc(e.building||'Bâtiment non précisé')} · ${esc(e.date)}</p><div class="two"><div><div class="big">${e.start&&e.stop?time(elapsed(e)):'—'}</div><div class="small muted">Durée du chronométrage</div></div><div><div class="big">${e.anomalies.length}</div><div class="small muted">Anomalies</div></div></div><p class="small">${e.events.length} événements, ${(e.annotations||[]).length} annotations et ${Object.values(e.observations).filter(x=>x.status).length}/${criteria.length} critères renseignés.</p></div><div class="card"><h2>Conclusion du formateur</h2><p class="small">Le rapport génère une synthèse factuelle des critères saisis. Complète-la avec ton appréciation professionnelle.</p><textarea id="conclusion" placeholder="Bilan général de l’exercice et améliorations prioritaires…" onchange="setConclusion()">${esc(e.conclusion)}</textarea><button class="btn secondary full spaced" onclick="setConclusion();validateReport()">Valider le rapport</button></div><div class="stack"><button class="btn full" onclick="setConclusion();printReport()">↗ Ouvrir le rapport / Enregistrer en PDF</button><button class="btn ghost full" onclick="go('observations')">Modifier les observations</button><button class="btn ghost full" onclick="go('details')">Informations administratives et modalités</button><button class="btn ghost full" onclick="go('finalcheck')">Check-list finale et bilan</button><button class="btn ghost full" onclick="go('anomalies')">Modifier les constats</button><button class="btn green full" onclick="go('annotations')">Modifier les annotations</button></div><div class="notice spaced">Le PDF est obtenu depuis la fonction « Imprimer / Enregistrer en PDF » du navigateur. Aucun e-mail n'est envoyé automatiquement. Ne considérez pas le document comme un rapport validé tant que le formateur ne l'a pas relu.</div>`}function setConclusion(){ex().conclusion=$('#conclusion')?.value||ex().conclusion;store()}function validateReport(){let e=ex();if(!e.client||!e.building||!e.date){alert('Le client, le bâtiment et la date sont nécessaires.');return}if(finalItems.some((_,i)=>(e.finalChecks||{})[i]?.status==='Non')&&!confirm('Attention : certaines vérifications finales sont négatives ou non vérifiées. Les réserves figureront dans le rapport. Continuer vers la confirmation ?'))return;if(!e.stop){alert('Termine le chronométrage avant la validation définitive.');return}if(finalItems.some((_,i)=>!['Oui','Non','Non applicable'].includes((e.finalChecks||{})[i]?.status))){alert('Complète toutes les vérifications finales : Oui, Non ou Non applicable.');return}if(confirm('VALIDATION DÉFINITIVE : après confirmation, cet exercice ne pourra plus être modifié ni supprimé. Le compte rendu restera uniquement consultable, imprimable et partageable. Confirmer ?')){e.status='Terminé';e.validatedAt=now();e.frozenReportData=JSON.parse(JSON.stringify({...e, frozenReportData:undefined}));e.frozenClientData=JSON.parse(JSON.stringify(cli(e.client)||{}));store();go('report')}}function printReport(){let e=ex(),c=cli(e.client);if(!c){alert('Choisissez un client avant de générer le rapport.');return}let w=window.open('','_blank');if(!w){alert('Autorisez les fenêtres pop-up pour ouvrir le rapport.');return}let good=Object.entries(e.observations).filter(([k,v])=>v.status==='Oui'||v.status==='Satisfaisant').map(([k])=>criteria[Number(k)]),bad=Object.entries(e.observations).filter(([k,v])=>v.status==='Non'||v.status==='À améliorer').map(([k])=>criteria[Number(k)]);let css=`body{font:12px/1.6 Arial,sans-serif;color:#203245;margin:38px auto;max-width:790px}h1,h2{color:#06385B}h1{font-size:26px}h2{font-size:17px;border-bottom:2px solid #F06B00;padding-bottom:7px;margin-top:27px}.top{border-top:11px solid #06385B;padding-top:21px}.brand{color:#F06B00;font-weight:900;font-size:22px}.muted{color:#63748a}.block{padding:12px 15px;background:#f1f5f8;border-radius:6px}table{border-collapse:collapse;width:100%;margin:12px 0}td,th{border:1px solid #d5dee6;text-align:left;padding:7px;vertical-align:top}th{background:#e7eef4}img{width:240px;max-height:200px;object-fit:contain}footer{margin-top:40px;font-size:10px;color:#667}button{padding:12px;border:0;background:#F06B00;color:white;border-radius:6px} @media print{body{margin:0;max-width:none}button{display:none}.block{print-color-adjust:exact}h2{break-after:avoid}tr{break-inside:avoid}}`;let trs=e.events.slice().sort((a,b)=>a.t-b.t).map(v=>`<tr><td>${esc(v.name)}</td><td>${esc(localdate(v.timestamp))}</td><td>T + ${time(v.t)}</td><td>${esc(v.source)}</td><td>${esc(v.place)}</td></tr>`).join('');let obs=criteria.map((s,i)=>{let v=e.observations[i]||{};return `<tr><td>${esc(s)}</td><td>${esc(v.status||'Non renseigné')}</td><td>${esc(v.place||'')}</td><td>${esc(v.note||'')}</td></tr>`}).join('');let anomalies=e.anomalies.map((a,i)=>`<div style="break-inside:avoid"><h3>${i+1}. ${esc(a.title)}</h3><p><b>Lieu :</b> ${esc(a.place||'Non précisé')}</p><p><b>Constat :</b> ${esc(a.description)}</p><p><b>Préconisation :</b> ${esc(a.action||'À définir')}</p>${a.photo?`<img src="${a.photo}" alt="Photo constat">`:''}</div>`).join('')||'<p>Aucune anomalie déclarée.</p>';let synthesis=`${good.length} critère(s) évalué(s) comme satisfaisant(s), ${bad.length} point(s) à améliorer et ${e.anomalies.length} anomalie(s) déclarée(s).`;let doc=`<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rapport ARKO - ${esc(c.name)}</title><style>${css}header .brandlogo{display:block;width:156px;max-width:48vw;height:46px;object-fit:contain;background:#fff;padding:4px 8px;border-radius:8px} .btn.green{background:var(--green)} .btn.danger-outline{background:#fff5f3;color:#a43b32;border:1px solid #e5b3ae}.annotation{border-left:4px solid var(--green)} .phase{color:var(--green);font-weight:700;font-size:12px} .btn.mini{min-height:38px;padding:7px 10px;font-size:12px} </style></head><body><div class="top"><div class="brand"><img src="${ARKO_LOGO_IMAGE}" style="width:310px;height:auto;max-width:100%" alt="ARKO-Form"></div><div class="muted">PRÉVENIR · FORMER · CONSEILLER</div><h1>COMPTE RENDU D'EXERCICE D'ÉVACUATION</h1><div class="block"><b>Client :</b> ${esc(c.name)}<br><b>Adresse :</b> ${esc(c.address)}<br><b>Établissement / zone :</b> ${esc(e.building)}<br><b>Date :</b> ${esc(e.date)}<br><b>Formateur :</b> ${esc(e.trainer)}<br><b>Type :</b> ${esc(e.announced)}<br><b>Effectif estimé :</b> ${esc(e.expected||'Non renseigné')}</div></div><h2>1. Contexte et objectifs</h2><p><b>Scénario :</b> ${esc(e.scenario||'Non renseigné')}</p><p><b>Objectifs :</b> ${esc(e.goals||'Non renseignés')}</p><h2>2. Chronologie de l'exercice</h2><p><b>Durée du chronométrage :</b> ${e.start&&e.stop?time(elapsed(e)):'Non déterminée'}.</p><table><thead><tr><th>Événement</th><th>Heure</th><th>Temps écoulé</th><th>Source</th><th>Zone</th></tr></thead><tbody>${trs||'<tr><td colspan="5">Aucun événement relevé</td></tr>'}</tbody></table><p class="muted">Le chronomètre débute à l’action du formateur et n’implique pas que l’alarme ait été déclenchée à cet instant.</p><h2>3. Évaluation des observations</h2><table><thead><tr><th>Critère</th><th>Évaluation</th><th>Zone</th><th>Précisions</th></tr></thead><tbody>${obs}</tbody></table><h2>4. Annotations du formateur</h2>${(e.annotations||[]).map(a=>`<p><b>${esc(a.phase)} — ${esc(localdate(a.created))}</b> (${esc(a.source)}, ${esc(a.place||'lieu non précisé')}) : ${esc(a.text)}</p>`).join('')||'<p>Aucune annotation complémentaire.</p>'}<h2>5. Anomalies et préconisations</h2>${anomalies}<h2>6. Renseignements administratifs et modalités</h2><table><tbody>${siteFields.map(([k,label])=>`<tr><td>${esc(label)}</td><td>${esc((e.siteInfo||{})[k]||'Non renseigné')}</td></tr>`).join('')}</tbody></table><h2>7. Vérifications de fin d’exercice</h2><table><thead><tr><th>Vérification</th><th>État</th><th>Observation</th></tr></thead><tbody>${finalItems.map((label,i)=>{let a=(e.finalChecks||{})[i]||{};return `<tr><td>${esc(label)}</td><td>${esc(a.status||'Non renseigné')}</td><td>${esc(a.note||'')}</td></tr>`}).join('')}</tbody></table><h2>8. Synthèse et conclusion</h2><p><b>Points positifs :</b> ${esc(e.positives||'Non renseignés')}</p><p><b>Points à améliorer :</b> ${esc(e.improvements||'Non renseignés')}</p><p>${esc(synthesis)}</p><p>${esc(e.conclusion||'Conclusion du formateur à compléter avant validation.')}</p><div class="block">Observations réalisées par un formateur unique mobile. Les constats portent uniquement sur les éléments effectivement observés ou explicitement signalés par un tiers. Le présent rapport ne constitue pas une vérification réglementaire des équipements.</div><footer>ARKO-FORM · Document ${e.status==='Terminé'?'finalisé':'PROVISOIRE — À RELIRE'} · Généré le ${esc(localdate(now()))}</footer><p><button onclick="window.print()">Imprimer ou enregistrer en PDF</button> <button onclick="if(window.opener){window.close()}else{history.back()}" style="background:#06385B">← Retour à l’application</button></p></body></html>`;w.document.open();w.document.write(doc);w.document.close()}const siteFields=[['session','N° de session','text'],['buildingCount','Nombre de bâtiments','number'],['buildingType','Type / classement de bâtiment','text'],['responsible','Responsable de l’établissement','text'],['registerShown','Registre de sécurité présenté','choice'],['registerWhy','Si non, pourquoi ?','text'],['siteFeatures','Particularités du site','text'],['staffCount','Effectif du personnel','number'],['publicCount','Effectif du public','number'],['openingHours','Horaires de fonctionnement','text'],['instructionsExist','Consignes de sécurité existantes','choice'],['alarmType','Type d’équipement d’alarme','text'],['ssiCategory','Catégorie de SSI','text'],['fumes','Exercice avec fumigènes','choice'],['incidentZone','Localisation de la zone sinistrée','text'],['alarmTrigger','Mode de déclenchement (DAI, DM, autre)','text'],['triggerLocation','Localisation du dispositif déclenché','text'],['siteComment','Observations complémentaires','text']];
const finalItems=['Déclencheur manuel réarmé','SSI / équipement d’alarme réarmé','DAS réarmés et remis en position normale','Désenfumage du local effectué si nécessaire','Registre de sécurité renseigné','Débriefing effectué'];
function details(){let e=ex();if(!e)return home();let v=e.siteInfo||{};return `<h1>Informations de l’établissement</h1><p>Complète les renseignements du modèle de compte rendu. Tous les champs restent modifiables après l’exercice.</p><div class="card">${siteFields.map(([k,label,type])=>`<label>${esc(label)}</label>${type==='choice'?`<select id="site_${k}" onchange="saveDetails(false)"><option value="">Non renseigné</option>${['Oui','Non','Non applicable'].map(q=>`<option ${v[k]===q?'selected':''}>${q}</option>`).join('')}</select>`:`<input id="site_${k}" type="${type}" value="${esc(v[k]||'')}" onchange="saveDetails(false)">`}`).join('')}<button class="btn full spaced" onclick="saveDetails(true)">Enregistrer et revenir à l’exercice</button></div>`}
function saveDetails(leave){let e=ex();if(!e)return;e.siteInfo=e.siteInfo||{};siteFields.forEach(([k])=>{const n=$('#site_'+k);if(n)e.siteInfo[k]=n.value});store();if(leave)go('prep')}
function finalcheck(){let e=ex();if(!e)return home();let v=e.finalChecks||{};return `<h1>Vérifications de fin d’exercice</h1><p>Renseigne les contrôles constatés. Réponds Oui, Non ou Non applicable. Une réponse non renseignée reste à compléter.</p>${finalItems.map((label,i)=>{let a=v[i]||{};return `<div class="card"><b>${esc(label)}</b><label>État constaté</label><select id="fin_${i}" onchange="saveFinal(false)">${['','Oui','Non','Non applicable'].map(x=>`<option value="${x}" ${a.status===x?'selected':''}>${x||'Choisir une réponse'}</option>`).join('')}</select><label>Précision / intervenant / réserve</label><textarea id="finNote_${i}" onchange="saveFinal(false)" placeholder="Observation facultative">${esc(a.note||'')}</textarea></div>`}).join('')}<div class="card"><label>Points positifs</label><textarea id="positives" onchange="saveFinal(false)">${esc(e.positives||'')}</textarea><label>Points à améliorer</label><textarea id="improvements" onchange="saveFinal(false)">${esc(e.improvements||'')}</textarea><button class="btn full spaced" onclick="saveFinal(true)">Enregistrer et voir le rapport →</button></div>`}
function saveFinal(leave){let e=ex();if(!e)return;e.finalChecks=e.finalChecks||{};finalItems.forEach((_,i)=>{if($('#fin_'+i))e.finalChecks[i]={status:$('#fin_'+i).value,note:$('#finNote_'+i).value}});e.positives=$('#positives')?.value||'';e.improvements=$('#improvements')?.value||'';store();if(leave)go('report')}
function backup(){return `<h1>Données et sauvegardes</h1><div class="card"><h2>Sauvegarde manuelle</h2><p>Les données sont conservées dans le navigateur de cet appareil. Pour éviter les pertes lors d'une mise à jour ou d'un changement de téléphone, exporte régulièrement un fichier JSON.</p><button class="btn full" onclick="exportData()">↓ Exporter une sauvegarde</button><label>Restaurer une sauvegarde JSON</label><input type="file" accept=".json,application/json" onchange="importData(event)"><div class="notice spaced">L'import remplace toutes les données actuelles. Conserve une sauvegarde préalable.</div></div><div class="card"><h2>Clients archivés</h2>${db.clients.filter(c=>c.archived).map(c=>`<div class="item row"><b>${esc(c.name)}</b><button class="btn mini secondary" onclick="unarchiveClient('${c.id}')">Réactiver</button></div>`).join('')||'<p class="small">Aucun client archivé.</p>'}</div><div class="card"><h2>Corbeille · Récupération</h2><p class="small">Les suppressions depuis l’application sont récupérables ici. Pense à exporter une sauvegarde avant une mise à jour.</p>${['clients','exercises'].map(kind=>`<h3>${kind==='clients'?'Clients':'Exercices'} (${db.trash[kind].length})</h3>${db.trash[kind].map(item=>`<div class="item row"><span>${esc(item.name||cli(item.client)?.name||item.date||'Exercice')}</span><button class="btn mini secondary" onclick="restoreTrash('${kind}','${item.id}')">Restaurer</button>${kind==='exercises'&&isLocked(item)?'':`<button class="btn mini danger-outline" onclick="permanentlyDeleteTrash('${kind}','${item.id}')">Effacer</button>`}</div>`).join('')||'<p class="small">Aucun élément.</p>'}`).join('')}</div><div class="card"><h2>État de cette installation</h2><p>${db.clients.length} client(s) · ${db.exercises.length} exercice(s)</p><p class="small">Mode de stockage : localStorage. Pas de synchronisation cloud ni de compte utilisateur en V1. L'effacement des données du navigateur peut supprimer les exercices.</p></div><div class="card"><h2>À propos</h2><p>ARKO Exercice d’évacuation · V1.3 prototype terrain, formateur unique. Démonstration fonctionnelle non destinée à être utilisée comme archive réglementaire unique.</p></div>`}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ARKO_EVAC_SAUVEGARDE_'+dateval()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(ev){let f=ev.target.files?.[0];if(!f)return;try{let o=JSON.parse(await f.text());if(!Array.isArray(o.clients)||!Array.isArray(o.exercises))throw Error('Format non reconnu');if(!confirm('Cette opération remplacera les données actuelles. Continuer ?'))return;db=o;if(!db.trash)db.trash={clients:[],exercises:[]};store();go('home')}catch(err){alert('Import impossible : '+err.message)}}

// V1.3 : protection des archives et migration non destructive.
const isLocked=e=>!!e&&(e.status==='Terminé'||!!e.validatedAt);
for(const e of db.exercises){
 if(!e.finalChecks)e.finalChecks={};
 if(e.finalChecks[7])e.finalChecks[5]=e.finalChecks[7]; else if(e.finalChecks[5]||e.finalChecks[6])delete e.finalChecks[5];
 if(e.finalChecks[6]||e.finalChecks[7]){delete e.finalChecks[6];delete e.finalChecks[7]}
 if(!e.observations)e.observations={};
 // Anciennes évaluations présentées selon la nouvelle grille sans les réinterpréter silencieusement.
}
function viewLocked(){const e=ex();return !!e&&isLocked(e)}
const originalGo=go;
go=function(v){if(viewLocked()&&['prep','live','observations','anomalies','annotations','details','finalcheck'].includes(v))v='report';return originalGo(v)};
const originalOpenE=openE;
openE=function(i){const target=db.exercises.find(e=>e.id===i);if(!target)return;db.active=i;store();go(isLocked(target)?'report':'prep')};
const originalReport=report;
report=function(){const e=ex();if(!isLocked(e))return originalReport();return `<div class="eyebrow">Archive définitive</div><h1>Exercice validé 🔒</h1><div class="card"><b>${esc(cli(e.client)?.name||e.frozenClientData?.name||'Client')}</b><p>${esc(e.building)} · ${esc(e.date)}</p><span class="badge">Lecture seule</span><p>Validation : ${esc(localdate(e.validatedAt))}</p><p>Les réponses, annotations et documents de cet exercice ne peuvent plus être modifiés ou supprimés.</p></div><button class="btn full" onclick="printReport()">↗ Consulter / partager / imprimer le rapport</button><button class="btn ghost full spaced" onclick="go('exercises')">← Retour aux exercices</button>`};
// Protection supplémentaire côté fonctions de saisie, même si un ancien bouton est encore affiché.
const guarded=['savePrep','startClock','stopClock','addEvent','setRating','updateObs','addAnomaly','addAnnotation','removeAnnotation','delAnomaly','setConclusion','saveDetails','saveFinal','validateReport'];
for(const name of guarded){const fn=globalThis[name];if(typeof fn==='function'){globalThis[name]=function(...args){if(viewLocked()){alert('Exercice validé : aucune modification possible.');go('report');return}return fn.apply(this,args)}}}
// Suppression directe d'un brouillon, jamais d'une archive finalisée.
deleteExercise=function(eid){const e=db.exercises.find(x=>x.id===eid);if(!e)return;if(isLocked(e)){alert('Cet exercice est définitivement validé et ne peut pas être supprimé.');return}if(!confirm('Supprimer DÉFINITIVEMENT cet exercice non validé, ses annotations et ses photos ? Opération irréversible.'))return;db.exercises=db.exercises.filter(x=>x.id!==eid);db.trash.exercises=db.trash.exercises.filter(x=>x.id!==eid);if(db.active===eid)db.active=null;store();render()};
deleteClient=function(cid){const c=cli(cid);if(!c)return;const linked=db.exercises.filter(e=>e.client===cid);if(linked.some(isLocked)){alert('Impossible de supprimer ce client : il possède au moins un exercice définitivement validé. Tu peux seulement archiver sa fiche.');if(confirm('Archiver ce client sans effacer son historique ?')){c.archived=true;store();render()}return}if(linked.length&& !confirm('Ce client possède '+linked.length+' exercice(s) NON validé(s). Supprimer définitivement le client ET tous ses exercices ?'))return;if(!confirm('SUPPRESSION DÉFINITIVE de « '+c.name+' »'+(linked.length?' et de ses exercices':'')+' : confirmer ?'))return;db.clients=db.clients.filter(x=>x.id!==cid);db.exercises=db.exercises.filter(e=>e.client!==cid);db.trash.clients=db.trash.clients.filter(x=>x.id!==cid);db.trash.exercises=db.trash.exercises.filter(x=>x.client!==cid);if(!db.exercises.some(e=>e.id===db.active))db.active=null;store();render()};
function permanentlyDeleteTrash(kind,idv){const item=db.trash[kind]?.find(x=>x.id===idv);if(!item)return;if(kind==='exercises'&&isLocked(item)){alert('Suppression interdite : exercice validé.');return}if(kind==='clients'&&[...db.exercises,...db.trash.exercises].some(e=>e.client===idv&&isLocked(e))){alert('Un exercice validé dépend de ce client.');return}if(!confirm('Supprimer DÉFINITIVEMENT cet élément de la corbeille ?'))return;db.trash[kind]=db.trash[kind].filter(x=>x.id!==idv);store();render()}
const originalRestore=restoreTrash;
restoreTrash=function(kind,idv){return originalRestore(kind,idv)};
// Archivage PDF : réutilise les données figées au moment de la validation.
const originalPrint=printReport;
printReport=function(){const e=ex();if(!e||!isLocked(e)||!e.frozenReportData)return originalPrint();const idx=db.exercises.findIndex(x=>x.id===e.id),original=db.exercises[idx];const originalClient=db.clients.find(x=>x.id===e.client);const ci=db.clients.indexOf(originalClient);db.exercises[idx]={...structuredClone(e.frozenReportData),status:'Terminé',validatedAt:e.validatedAt};if(originalClient&&e.frozenClientData)db.clients[ci]=structuredClone(e.frozenClientData);try{return originalPrint()}finally{db.exercises[idx]=original;if(originalClient&&e.frozenClientData)db.clients[ci]=originalClient}};
// Décision explicite : les archives restaurées dans une sauvegarde restent verrouillées.

if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
