<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06385B"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-apple.png"><title>ARKO Exercice d’évacuation • V1.3</title><style>
:root{--navy:#06385B;--orange:#F06B00;--green:#2F8533;--bg:#f3f6f9;--ink:#172b41;--muted:#67788a;--line:#dce4eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:var(--navy);color:white;padding:18px max(18px,env(safe-area-inset-left));position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;box-shadow:0 3px 14px #06213b1b}header strong{letter-spacing:.035em;font-size:16px}header small{display:block;color:#bed2e2;font-size:11px}header .logo{color:#ff934d}main{max-width:700px;margin:0 auto;padding:22px 16px 110px}h1{font-size:25px;line-height:1.16;margin:3px 0 9px}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:8px 0}p{margin:7px 0;color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:17px;margin:13px 0;box-shadow:0 3px 11px #12314c0b}.eyebrow{font-size:11px;color:var(--muted);font-weight:750;text-transform:uppercase;letter-spacing:.08em}.badge{display:inline-block;border-radius:30px;padding:4px 10px;font-size:11px;font-weight:700;background:#e8f5ed;color:#216346}.badge.orange{background:#fff0e4;color:#a84f10}.badge.gray{background:#e8edf2;color:#55677a}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:9px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:12px;background:var(--orange);color:#fff;font-weight:750;min-height:48px;padding:11px 16px;display:inline-flex;align-items:center;justify-content:center;text-align:center;gap:7px}.btn.secondary{background:var(--navy)}.btn.ghost{background:#eef2f6;color:var(--navy)}.btn.outline{background:white;color:var(--navy);border:1px solid #bccbd8}.btn.red{background:#b94e43}.btn:disabled{opacity:.45;cursor:not-allowed}.full{width:100%}label{display:block;color:#293e52;font-weight:700;font-size:13px;margin:12px 0 6px}input,select,textarea{border:1px solid #cbd8e1;border-radius:10px;width:100%;background:#fff;color:#203448;padding:12px;min-height:45px}textarea{min-height:82px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid #F06B0055;border-color:var(--orange)}.muted{color:var(--muted)}.small{font-size:12px}.timer{font-size:53px;font-weight:800;letter-spacing:.025em;font-variant-numeric:tabular-nums;text-align:center;color:var(--navy);padding:15px 0 6px}.timerbox{background:#fff1e8;border:1px solid #ffdec6;text-align:center;border-radius:16px;padding:15px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{min-height:68px;line-height:1.2}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:white;border-top:1px solid var(--line);padding:9px 9px calc(9px + env(safe-area-inset-bottom));z-index:5}.nav>div{width:min(700px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:2px}.nav button{border:0;background:transparent;color:#738497;padding:7px 2px;font-size:11px;min-height:50px}.nav button span{display:block;font-size:19px}.nav button.active{color:var(--orange);font-weight:800}.item{padding:11px 0;border-bottom:1px solid #e8edf0}.item:last-child{border:0}.big{font-size:25px;font-weight:800;color:var(--navy)}.statuses{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.statuses button{border:1px solid #ccd6df;border-radius:9px;background:white;min-height:43px;padding:6px;font-size:12px}.statuses .selected{background:var(--navy);color:white;border-color:var(--navy)}.photo{width:100%;max-height:210px;object-fit:cover;border-radius:10px;margin:6px 0}.note{background:#eef5fb;border-radius:10px;padding:12px;color:#38546b;font-size:12px}.notice{border-left:4px solid var(--orange);padding:10px 12px;background:#fff8f1;color:#825022;font-size:12px}.spaced{margin-top:15px}.hidden{display:none}.center{text-align:center}a{color:var(--navy)}@media (min-width:600px){main{padding-top:30px}.quick{grid-template-columns:repeat(4,1fr)}}@media print{header,.nav,button{display:none!important}}
header .brandlogo{display:block;width:156px;max-width:48vw;height:46px;object-fit:contain;background:#fff;padding:4px 8px;border-radius:8px} .btn.green{background:var(--green)} .btn.danger-outline{background:#fff5f3;color:#a43b32;border:1px solid #e5b3ae}.annotation{border-left:4px solid var(--green)} .phase{color:var(--green);font-weight:700;font-size:12px} .btn.mini{min-height:38px;padding:7px 10px;font-size:12px} </style></head><body><header><div><strong><img class="brandlogo" src="logo-officiel.svg" alt="ARKO-Form"></strong><small>ARKO EXERCICE D’ÉVACUATION · V1.3</small></div><span style="font-size:12px;color:#bed2e2">Mode local</span></header><main id="app"></main><nav class="nav"><div id="nav"></div></nav>
<script>
'use strict';const K='arko_evac_v1_test_2026',criteria=['Audibilité de l’alarme','Réaction des occupants','Mise en évacuation','Guidage des occupants','Rôle des serre-files','Circulations et issues dégagées','Prise en compte des personnes nécessitant une aide','Point de rassemblement','Recensement des personnes','Coordination et communication','Prise en compte de l’alarme','Localisation du sinistre','Levée de doute','Alerte des secours','Mise en œuvre des moyens d’extinction','Compartimentage (fermeture des portes)','Application des consignes du site','Évacuation prioritaire des locaux contigus au local sinistré','Évacuation générale','Encadrement de l’évacuation (guide-file et serre-file)','Interdiction de retour en arrière','Vérification de l’ensemble des locaux','Utilisation des cheminements les plus adaptés','Regroupement au point de rassemblement','Comptage des personnes évacuées','Accueil des secours','Respect général des consignes'];const empty=()=>({clients:[],exercises:[],active:null,trash:{clients:[],exercises:[]}});let db;try{db=JSON.parse(localStorage.getItem(K))||empty()}catch{db=empty()}if(!db.trash)db.trash={clients:[],exercises:[]};let view='home',editing=null,liveTimer=null,reportOpenedFrom='report';const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const now=()=>new Date().toISOString();function store(){try{localStorage.setItem(K,JSON.stringify(db));return true}catch(e){alert('Stockage local saturé ou inaccessible. Exportez une sauvegarde avant de poursuivre.');return false}}function ex(){return db.exercises.find(e=>e.id===db.active)}function cli(cid){return db.clients.find(c=>c.id===cid)}function time(s){let a=Math.max(0,Math.floor(s||0));return String(Math.floor(a/60)).padStart(2,'0')+':'+String(a%60).padStart(2,'0')}function elapsed(e){if(!e.start)return 0;return Math.max(0,Math.round(((e.stop||Date.now())-e.start)/1000))}function localdate(s){return s?new Date(s).toLocaleString('fr-FR'):'—'}function dateval(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function newE(){return{id:id(),client:'',building:'',date:dateval(),trainer:'Quentin',scenario:'',expected:'',announced:'Annoncé',goals:'',notes:'',start:null,stop:null,events:[],observations:{},anomalies:[],annotations:[],conclusion:'',siteInfo:{},finalChecks:{},positives:'',improvements:'',status:'Brouillon',created:now()}}function ensureAnnotations(){let e=ex();if(e&&!Array.isArray(e.annotations))e.annotations=[];return e}function nav(){const tabs=[['home','⌂','Accueil'],['exercises','▤','Exercices'],['clients','♙','Clients'],['backup','⚙','Données']];$('#nav').innerHTML=tabs.map(([v,ic,label])=>`<button class="${view===v?'active':''}" onclick="go('${v}')"><span>${ic}</span>${label}</button>`).join('')}function render(){nav();const a=$('#app');a.innerHTML=({home:home,clients:clientsPage,exercises:exercisesPage,prep:prep,live:live,observations:observations,anomalies:anomalies,annotations:annotations,report:report,details:details,finalcheck:finalcheck,backup:backup}[view]||home)();if(view==='live')tick();else if(liveTimer){clearInterval(liveTimer);liveTimer=null}}function go(v){view=v;render();window.scrollTo(0,0)}function startNew(){const e=newE();db.exercises.unshift(e);db.active=e.id;store();go('prep')}function quickStart(){const e=newE();e.scenario='Mode chronomètre rapide';db.exercises.unshift(e);db.active=e.id;store();go('live')}function openE(i){db.active=i;store();go('prep')}function home(){let es=db.exercises,done=es.filter(e=>e.status==='Terminé').length;return `<div class="eyebrow">Bienvenue sur ARKO Exercice d’évacuation</div><h1>Vos exercices, vos rapports.</h1><p>Préparez, observez et générez le compte rendu depuis votre téléphone.</p><div class="two"><div class="card"><div class="big">${es.length}</div><div class="small muted">Exercices enregistrés</div></div><div class="card"><div class="big">${done}</div><div class="small muted">Rapports finalisés</div></div></div><button class="btn full" onclick="startNew()">＋ Nouvel exercice</button><button class="btn green full spaced" onclick="quickStart()">⏱ Chronomètre rapide — sans formulaire</button><section class="card"><h2>Exercices récents</h2>${es.length?es.slice(0,6).map(e=>`<div class="item row"><div><b>${esc(cli(e.client)?.name||'Client non renseigné')}</b><div class="small muted">${esc(e.building||'Bâtiment non renseigné')} · ${esc(e.date)}</div><span class="badge ${e.status==='Terminé'?'':'orange'}">${esc(e.status)}</span></div><button class="btn ghost" onclick="openE('${e.id}')">Ouvrir</button></div>`).join(''):'<p>Aucun exercice pour le moment.</p>'}</section><div class="notice">Prototype local : les données sont stockées uniquement dans ce navigateur. Utilisez régulièrement « Données » → « Exporter une sauvegarde ».</div>`}function clientsPage(){return `<h1>Clients et établissements</h1><p>Créez vos clients avant le premier exercice.</p><div class="card"><h2>Nouveau client</h2><form onsubmit="addClient(event)"><label>Entreprise *</label><input name="name" required placeholder="Nom du client"><label>Adresse</label><input name="address" placeholder="Adresse du site"><label>Contact responsable</label><input name="contact"><label>E-mail de contact</label><input type="email" name="email"><button class="btn full spaced" type="submit">Enregistrer le client</button></form></div><div class="card"><h2>Clients (${db.clients.length})</h2>${db.clients.filter(c=>!c.archived).map(c=>`<div class="item"><b>${esc(c.name)}</b><div class="small muted">${esc(c.address)}</div><div class="small muted">${esc(c.contact)} ${esc(c.email)}</div><button class="btn mini danger-outline spaced" onclick="deleteClient('${c.id}')">Supprimer / archiver</button></div>`).join('')||'<p>Aucun client enregistré.</p>'}</div>`}function unarchiveClient(cid){let c=cli(cid);if(c){c.archived=false;store();render()}}function deleteClient(cid){let c=cli(cid);if(!c)return;let linked=db.exercises.filter(e=>e.client===cid);if(linked.length){if(!confirm(`${c.name} possède ${linked.length} exercice(s). Ce client sera archivé avec ses exercices pour préserver les rapports. Continuer ?`))return;c.archived=true;store();render();return}if(!confirm(`Placer le client « ${c.name} » dans la corbeille ?`))return;db.trash.clients.push({...c,deletedAt:now()});db.clients=db.clients.filter(v=>v.id!==cid);store();render()}function deleteExercise(eid){let e=db.exercises.find(v=>v.id===eid);if(!e)return;if(!confirm('Placer cet exercice et ses annotations dans la corbeille ? Il pourra être restauré depuis Données.'))return;db.trash.exercises.push({...e,deletedAt:now()});db.exercises=db.exercises.filter(v=>v.id!==eid);if(db.active===eid)db.active=null;store();render()}function restoreTrash(kind,idv){let item=db.trash[kind].find(v=>v.id===idv);if(!item)return;delete item.deletedAt;if(kind==='clients'){item.archived=false;db.clients.push(item)}else db.exercises.unshift(item);db.trash[kind]=db.trash[kind].filter(v=>v.id!==idv);store();render()}function addClient(ev){ev.preventDefault();let f=new FormData(ev.target);let c={id:id(),name:f.get('name').trim(),address:f.get('address').trim(),contact:f.get('contact').trim(),email:f.get('email').trim()};db.clients.push(c);store();render()}function exercisesPage(){return `<h1>Exercices</h1><button class="btn full" onclick="startNew()">＋ Nouvel exercice</button><button class="btn green full spaced" onclick="quickStart()">⏱ Chronomètre rapide — sans formulaire</button><div class="card">${db.exercises.map(e=>`<div class="item row"><div><b>${esc(cli(e.client)?.name||'Client non renseigné')}</b><div class="small muted">${esc(e.date)} · ${esc(e.building)}</div><span class="badge ${e.status==='Terminé'?'':'orange'}">${esc(e.status)}</span></div><div class="stack"><button class="btn mini ghost" onclick="openE('${e.id}')">Ouvrir</button>${isLocked(e)?'<span class="badge gray">🔒 Archivé</span>':`<button class="btn mini danger-outline" onclick="deleteExercise('${e.id}')">Supprimer définitivement</button>`}</div></div>`).join('')||'<p>Aucun exercice.</p>'}</div>`}function prep(){let e=ex();if(!e)return home();return `<div class="eyebrow">Étape 1 · Préparation</div><h1>Nouvel exercice</h1><p>Renseignez les informations principales et enregistrez votre brouillon.</p><div class="card"><label>Client *</label><select id="client">${'<option value="">Choisir un client</option>'}${db.clients.filter(c=>!c.archived||c.id===e.client).map(c=>`<option value="${c.id}" ${e.client===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>${db.clients.length===0?'<p class="notice">Créez d’abord un client dans l’onglet Clients.</p>':''}<label>Bâtiment / zone *</label><input id="building" value="${esc(e.building)}" placeholder="Bâtiment principal"><label>Date *</label><input type="date" id="date" value="${esc(e.date)}"><label>Formateur</label><input id="trainer" value="${esc(e.trainer)}"><label>Scénario</label><textarea id="scenario" placeholder="Ex. : déclenchement de l’alarme incendie">${esc(e.scenario)}</textarea><div class="two"><div><label>Effectif estimé</label><input type="number" min="0" id="expected" value="${esc(e.expected)}"></div><div><label>Type</label><select id="announced"><option ${e.announced==='Annoncé'?'selected':''}>Annoncé</option><option ${e.announced==='Inopiné'?'selected':''}>Inopiné</option></select></div></div><label>Objectifs de l'exercice</label><textarea id="goals" placeholder="Ex. : tester la prise en charge des occupants">${esc(e.goals)}</textarea><button class="btn secondary full spaced" onclick="savePrep()">Enregistrer le brouillon</button></div><div class="stack"><button class="btn full" onclick="savePrep('live')">${e.start?'Reprendre le chronométrage':'Passer au chronométrage'} →</button><button class="btn ghost full" onclick="savePrep('details')">Informations détaillées du site →</button><button class="btn green full" onclick="savePrep('annotations')">✎ Annotations (avant / pendant / après)</button><button class="btn ghost full" onclick="savePrep('observations')">Compléter la grille d’évaluation</button><button class="btn ghost full" onclick="savePrep('finalcheck')">Vérifications de fin d’exercice</button><button class="btn ghost full" onclick="savePrep('report')">Voir le rapport</button></div>`}function savePrep(next){let e=ex();for(let f of ['client','building','date','trainer','scenario','expected','announced','goals'])e[f]=$('#'+f).value;e.status=e.status==='Terminé'?'Terminé':e.stop?'Chronométrage terminé':e.start?'En cours':'Brouillon';store();if(next)go(next);else alert('Brouillon enregistré sur cet appareil.')}function live(){let e=ex();if(!e)return home();let buttons=['Déclenchement alarme','Début évacuation','Dernier occupant sorti','Rassemblement terminé'];return `<div class="row"><div><div class="eyebrow">Étape 2 · Terrain</div><h1>Exercice en cours</h1></div><span class="badge ${e.start&&!e.stop?'':'orange'}">${e.start&&!e.stop?'En cours':'Prêt'}</span></div><p>${esc(cli(e.client)?.name||'Client non renseigné')} · ${esc(e.building)}</p><div class="timerbox"><div class="eyebrow">Temps depuis le démarrage manuel</div><div class="timer" id="clock">${time(elapsed(e))}</div>${!e.start?'<button class="btn full" onclick="startClock()">▶ Démarrer le chronomètre</button>':e.stop?'<div class="badge">Chronométrage terminé</div>':'<button class="btn ghost full" onclick="stopClock()">■ Terminer le chronométrage</button>'}</div><div class="card"><h2>Événements rapides</h2><p class="small">Choisis uniquement les événements constatés. L’ordre est libre.</p><div class="quick">${buttons.map((t,i)=>`<button class="btn ${i%2?'secondary':'outline'}" ${!e.start||e.stop?'disabled':''} onclick="addEvent('${i}')">${esc(t)}</button>`).join('')}</div><button class="btn ghost full spaced" onclick="addEvent('autre')" ${!e.start||e.stop?'disabled':''}>＋ Autre événement / remarque</button></div><div class="card"><h2>Chronologie (${e.events.length})</h2>${e.events.slice().reverse().map(v=>`<div class="item"><div class="row"><b>${esc(v.name)}</b><span class="badge gray">T + ${time(v.t)}</span></div><div class="small muted">${esc(v.source)} · ${esc(v.place||'Zone non précisée')} · ${localdate(v.timestamp)}</div>${v.note?`<div class="small">${esc(v.note)}</div>`:''}</div>`).join('')||'<p>Aucun événement enregistré.</p>'}</div><button class="btn green full" onclick="go('annotations')">✎ Ajouter des annotations à tout moment</button><button class="btn ghost full spaced" onclick="go('observations')">Grille d’évaluation →</button><button class="btn ghost full spaced" onclick="go('finalcheck')">Check-list de fin d’exercice →</button><p class="small">La durée affichée est celle du chronomètre. Elle ne remplace pas un horaire d’alarme non relevé.</p>`}function tick(){if(liveTimer)clearInterval(liveTimer);liveTimer=setInterval(()=>{let e=ex();if(e&&$('#clock'))$('#clock').textContent=time(elapsed(e))},500)}function startClock(){let e=ex();if(!e.start){e.start=Date.now();e.status='En cours';store()}render()}function stopClock(){let e=ex();if(!e.stop&&confirm('Terminer le chronométrage ? Cette action sera enregistrée.')){e.stop=Date.now();store();render()}}function addEvent(x){let e=ex(), names=['Déclenchement alarme','Début évacuation','Dernier occupant sorti','Rassemblement terminé'];let name=x==='autre'?prompt('Nom de l’événement :'):names[Number(x)];if(!name)return;let src=prompt('Source : saisir 1 = observé directement, 2 = communiqué par un tiers','1');if(src===null)return;let source=src==='2'?'Communiqué par un tiers':'Observé directement';let place=prompt('Position / zone au moment de l’observation (facultatif) :','')||'';let note=prompt('Commentaire rapide (facultatif) :','')||'';let stamp=Date.now();e.events.push({id:id(),name,source,place,note,t:Math.round((stamp-e.start)/1000),timestamp:new Date(stamp).toISOString()});store();render()}function annotations(){let e=ensureAnnotations();if(!e)return home();let phase=e.stop?'Après l’exercice':e.start?'Pendant l’exercice':'Avant l’exercice';return `<div class="eyebrow">Notes terrain · Indépendantes du chronomètre</div><h1>Annotations</h1><p>Saisis tes remarques avant, pendant ou après l'exercice. Aucun chronomètre requis.</p><div class="card"><div class="phase">Phase suggérée : ${phase}</div><form onsubmit="addAnnotation(event)"><label>Phase</label><select name="phase"><option ${phase==='Avant l’exercice'?'selected':''}>Avant l’exercice</option><option ${phase==='Pendant l’exercice'?'selected':''}>Pendant l’exercice</option><option ${phase==='Après l’exercice'?'selected':''}>Après l’exercice</option></select><label>Zone / emplacement</label><input name="place" placeholder="Facultatif : escalier, sortie, rassemblement…"><label>Source</label><select name="source"><option>Observé directement</option><option>Communiqué par un tiers</option><option>Autre / à préciser</option></select><label>Annotation *</label><textarea required name="text" placeholder="Note libre, constat, point positif, observation à reprendre dans le rapport..."></textarea><button class="btn green full spaced" type="submit">＋ Enregistrer l’annotation</button></form></div><div class="card"><h2>Annotations enregistrées (${e.annotations.length})</h2>${e.annotations.slice().reverse().map(a=>`<div class="item annotation"><div class="row"><b>${esc(a.phase)}</b><button class="btn mini danger-outline" onclick="removeAnnotation('${a.id}')">Retirer</button></div><div class="small muted">${esc(localdate(a.created))} · ${esc(a.place||'Zone non précisée')} · ${esc(a.source)}</div><p>${esc(a.text)}</p></div>`).join('')||'<p>Aucune annotation pour le moment.</p>'}</div><div class="stack"><button class="btn secondary full" onclick="go('live')">↩ Chronomètre</button><button class="btn ghost full" onclick="go('observations')">Grille d'évaluation</button><button class="btn ghost full" onclick="go('report')">Rapport</button></div>`}function addAnnotation(ev){ev.preventDefault();let e=ensureAnnotations(),f=new FormData(ev.target);e.annotations.push({id:id(),phase:f.get('phase'),place:f.get('place').trim(),source:f.get('source'),text:f.get('text').trim(),created:now()});store();render()}function removeAnnotation(i){let e=ensureAnnotations();if(confirm('Retirer cette annotation ?')){e.annotations=e.annotations.filter(a=>a.id!==i);store();render()}}

openE=function(i){const target=db.exercises.find(e=>e.id===i);if(!target)return;db.active=i;store();go(isLocked(target)?'report':'prep')};
const originalReport=report;
report=function(){const e=ex();if(!isLocked(e))return originalReport();return `<div class="eyebrow">Archive définitive</div><h1>Exercice validé 🔒</h1><div class="card"><b>${esc(cli(e.client)?.name||e.frozenClientData?.name||'Client')}</b><p>${esc(e.building)} · ${esc(e.date)}</p><span class="badge">Lecture seule</span><p>Validation : ${esc(localdate(e.validatedAt))}</p><p>Les réponses, annotations et documents de cet exercice ne peuvent plus être modifiés ou supprimés.</p></div><button class="btn full" onclick="printReport()">↗ Consulter / partager / imprimer le rapport</button><button class="btn ghost full spaced" onclick="go('exercises')">← Retour aux exercices</button>`};
// Protection supplémentaire côté fonctions de saisie, même si un ancien bouton est encore affiché.
const guarded=['savePrep','startClock','stopClock','addEvent','setRating','updateObs','addAnomaly','addAnnotation','removeAnnotation','delAnomaly','setConclusion','saveDetails','saveFinal','validateReport'];
for(const name of guarded){const fn=globalThis[name];if(typeof fn==='function'){globalThis[name]=function(...args){if(viewLocked()){alert('Exercice validé : aucune modification possible.');go('report');return}return fn.apply(this,args)}}}
// Suppression directe d'un brouillon, jamais d'une archive finalisée.
deleteExercise=function(eid){const e=db.exercises.find(x=>x.id===eid);if(!e)return;if(isLocked(e)){alert('Cet exercice est définitivement validé et ne peut pas être supprimé.');return}if(!confirm('Supprimer DÉFINITIVEMENT cet exercice non validé, ses annotations et ses photos ? Opération irréversible.'))return;db.exercises=db.exercises.filter(x=>x.id!==eid);db.trash.exercises=db.trash.exercises.filter(x=>x.id!==eid);if(db.active===eid)db.active=null;store();render()};
deleteClient=function(cid){const c=cli(cid);if(!c)return;const linked=db.exercises.filter(e=>e.client===cid);if(linked.some(isLocked)){alert('Impossible de supprimer ce client : il possède au moins un exercice définitivement validé. Tu peux seulement archiver sa fiche.');if(confirm('Archiver ce client sans effacer son historique ?')){c.archived=true;store();render()}return}if(linked.length&& !confirm('Ce client possède '+linked.length+' exercice(s) NON validé(s). Supprimer définitivement le client ET tous ses exercices ?'))return;if(!confirm('SUPPRESSION DÉFINITIVE de « '+c.name+' »'+(linked.length?' et de ses exercices':'')+' : confirmer ?'))return;db.clients=db.clients.filter(x=>x.id!==cid);db.exercises=db.exercises.filter(e=>e.client!==cid);db.trash.clients=db.trash.clients.filter(x=>x.id!==cid);db.trash.exercises=db.trash.exercises.filter(x=>x.client!==cid);if(!db.exercises.some(e=>e.id===db.active))db.active=null;store();render()};
function permanentlyDeleteTrash(kind,idv){const item=db.trash[kind]?.find(x=>x.id===idv);if(!item)return;if(kind==='exercises'&&isLocked(item)){alert('Suppression interdite : exercice validé.');return}if(kind==='clients'&&[...db.exercises,...db.trash.exercises].some(e=>e.client===idv&&isLocked(e))){alert('Un exercice validé dépend de ce client.');return}if(!confirm('Supprimer DÉFINITIVEMENT cet élément de la corbeille ?'))return;db.trash[kind]=db.trash[kind].filter(x=>x.id!==idv);store();render()}
const originalRestore=restoreTrash;
restoreTrash=function(kind,idv){return originalRestore(kind,idv)};
// Archivage PDF : réutilise les données figées au moment de la validation.
const originalPrint=printReport;
printReport=function(){const e=ex();if(!e||!isLocked(e)||!e.frozenReportData)return originalPrint();const idx=db.exercises.findIndex(x=>x.id===e.id),original=db.exercises[idx];const originalClient=db.clients.find(x=>x.id===e.client);const ci=db.clients.indexOf(originalClient);db.exercises[idx]={...structuredClone(e.frozenReportData),status:'Terminé',validatedAt:e.validatedAt};if(originalClient&&e.frozenClientData)db.clients[ci]=structuredClone(e.frozenClientData);try{return originalPrint()}finally{db.exercises[idx]=original;if(originalClient&&e.frozenClientData)db.clients[ci]=originalClient}};
// Décision explicite : les archives restaurées dans une sauvegarde restent verrouillées.

if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
